# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
weibo_username: lzh173
zhihu_username: lzh173
github_username: lzh173
twitter_username: lzh173
# 未使用的平台保持注释，留作模板示例：
#facebook_username:  your-facebook
#linkedin_username:  your-linkedin

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
# Jekyll 的 EntryFilter 会拒绝一切以 . _ # ~ 开头的**文件和目录**。
# CNAME 不以 _ 开头会自动复制，但 Cloudflare Pages 的 _headers / _redirects
# 必须在这里显式 include，否则不会进入 _site/。
# 详见 lib/jekyll/entry_filter.rb 的 SPECIAL_LEADING_CHAR_REGEX。
include:
  - "_headers"
  - "_redirects"
# 说明：以 _ 开头的目录（_posts/_layouts/_includes/_plugins/_doc 等）
# 由 Jekyll 默认排除，无需在此列出。这里只列「不以 _ 开头、但不该发布」的东西。
# static/ 必须排除：它的内容由 _plugins/static_files.rb 映射到站点根目录，
# 若不排除，Jekyll 还会把源目录原样再复制一份到 /static/。
exclude:
  [
    "node_modules",
    "package.json",
    "package-lock.json",
    "Gemfile",
    "Gemfile.lock",
    "Rakefile",
    "README.md",
    "LICENSE",
    "scripts",
    "src",
    "static",
    "redirect-site",
    "lzh173.github.io",
    "about_patch.exe",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus settings
# 原来写的是 shortname "lzh"，这是极短字符串、几乎必然被他人注册，
# 且 Disqus 会注入大量第三方脚本与广告。已关闭。
#
# 替代方案（推荐 Giscus：免费、无广告、基于 GitHub Discussions）：
#   1. 在 GitHub 仓库 Settings → General → Features 勾选 Discussions
#   2. 安装 Giscus App：https://github.com/apps/giscus
#   3. 到 https://giscus.app/ 按仓库生成配置，把 <script> 片段放进 _layouts/post.html
#   4. 中文站点也可考虑 Waline / Twikoo（需自建后端）
#
# 置为 false 即关闭评论区；改成你自己的 Disqus shortname 可重新启用。
disqus_username: false
# Netease settings
netease_comment: false

# Analytics settings
